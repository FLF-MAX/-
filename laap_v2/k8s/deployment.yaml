apiVersion: apps/v1
kind: Deployment
metadata:
  name: laap-v2
  namespace: laap-v2
  labels:
    app: laap-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laap-v2
  template:
    metadata:
      labels:
        app: laap-v2
    spec:
      containers:
        - name: api
          image: laap-v2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11546
          envFrom:
            - configMapRef:
                name: laap-v2-config
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: laap-v2-secret
                  key: deepseek-api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 11546
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 11546
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 300Mi
            limits:
              cpu: "1"
              memory: 1Gi